name: IaC Scan
on:
  pull_request:
    paths:
      - 'iac/terraform/**'
      - '.github/workflows/iac_scan.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'iac/terraform/**'

jobs:
  tf-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./iac/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Set up tf
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform init -input=false -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

  checkov-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        id: checkov
        run: |
          checkov -d ./iac/terraform --output json --output-file checkov-report.json \
          --skip-framework dockerfile || true

      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.json

  tfsec-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ./iac/terraform
          format: json
          additional_args: --out tfsec-report.json
        continue-on-error: true

      - name: Upload report tfsec
        uses: actions/upload-artifact@v4
        with:
          name: tfsec-report
          path: ./iac/terraform/tfsec-report.json

