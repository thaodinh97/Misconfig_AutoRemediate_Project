name: IaC Scan
on:
  pull_request:
    branches:
      - main
    paths:
      - 'iac/terraform/**'
      - '.github/workflows/iac_scan.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'iac/terraform/**'

jobs:
  tf-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./iac/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Set up tf
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform init -input=false -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

  checkov-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        id: checkov
        run: |
          checkov -d ./iac/terraform --output json --output-file checkov-report.json \
          --skip-framework dockerfile || true

      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.json

      - name: Comment PR with findings
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('checkov-report.json', 'utf8'));
            const failed = report.check_type.results.failed_checks || [];
            
            if (failed.length > 0) {
              const comment = `## Checkov Findings\n\n` +
                `**Failed Checks: ${failed.length}**\n\n` +
                failed.slice(0, 10).map(c => 
                  `- ${c.check_id}: ${c.check_name} (${c.resource})`
                ).join('\n');
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  tfsec-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ./iac/terraform
          format: json
          additional_args: --out tfsec-report.json
        continue-on-error: true

      - name: Upload report tfsec
        uses: actions/upload-artifact@v4
        with:
          name: tfsec-report
          path: ./iac/terraform/tfsec-report.json

